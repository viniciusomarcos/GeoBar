services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geobar-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geobar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geobar}
      POSTGRES_DB: ${POSTGRES_DB:-geobar}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geobar} -d ${POSTGRES_DB:-geobar}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
