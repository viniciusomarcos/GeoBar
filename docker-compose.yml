services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geobar-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geobar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geobar}
      POSTGRES_DB: ${POSTGRES_DB:-geobar}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geobar} -d ${POSTGRES_DB:-geobar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: geobar-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geobar}:${POSTGRES_PASSWORD:-geobar}@db:5432/${POSTGRES_DB:-geobar}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  pgdata:
