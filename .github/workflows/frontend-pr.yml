name: Frontend PR

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/frontend-checks.yml

  deploy:
    needs: checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/frontend-deploy.yml
    with:
      environment: preview
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  preview-comment:
    name: Update preview comment
    needs: deploy
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    concurrency:
      group: vercel-preview-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PREVIEW_URL: ${{ needs.deploy.outputs.url }}
      PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Create or update the PR preview comment
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request
            if (!pr) {
              throw new Error('Preview comments require a pull request event')
            }

            const previewUrl = new URL(process.env.PREVIEW_URL)
            if (previewUrl.protocol !== 'https:') {
              throw new Error('The deployment must return an HTTPS preview URL')
            }

            const { owner, repo } = context.repo
            const sha = process.env.PREVIEW_COMMIT
            if (!sha) {
              throw new Error('The preview source commit is missing')
            }
            const { data: current } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr.number
            })
            if (current.state !== 'open' || current.head.sha !== sha) {
              core.info('Skipping a preview for a closed PR or an outdated commit')
              return
            }

            const marker = '<!-- geobar-vercel-preview -->'
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              '### Vercel preview',
              '',
              `[Open GeoBar](${previewUrl.href})`,
              '',
              `Commit: [\`${sha.slice(0, 7)}\`](${context.serverUrl}/${owner}/${repo}/commit/${sha})`,
              `Workflow: [View deployment](${runUrl})`
            ].join('\n')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100
            })
            const existing = comments.find((comment) => comment.body?.startsWith(marker))
            if (existing) {
              if (existing.body === body) {
                core.info('The preview comment is already up to date')
                return
              }
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              })
              return
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body
            })
