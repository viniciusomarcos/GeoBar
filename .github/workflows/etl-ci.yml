name: ETL CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  etl:
    name: ETL (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            etl/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check etl tests

      - name: Run unit tests with coverage
        run: >-
          pytest -m "not integration"
          --cov=etl
          --cov-report=xml:coverage.xml
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Upload ETL coverage to Codecov
        if: >-
          matrix.os == 'ubuntu-latest' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.xml
          flags: etl
          name: etl-${{ github.event_name }}-${{ github.run_id }}
          disable_search: true
          fail_ci_if_error: true

      - name: Upload coverage report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: etl-coverage-${{ matrix.os }}
          path: coverage.xml
          retention-days: 14

  infra:
    name: Infra (Docker Compose & SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Verify database/init.sql is present and non-empty
        run: test -s database/init.sql

  postgis-integration:
    name: PostGIS Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geobar
          POSTGRES_PASSWORD: geobar
          POSTGRES_DB: geobar
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U geobar -d geobar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://geobar:geobar@localhost:5432/geobar
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            etl/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run PostGIS integration tests
        run: pytest -m integration -v
