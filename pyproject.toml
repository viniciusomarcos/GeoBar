[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: testes de integração que exigem PostgreSQL com PostGIS real",
]

[tool.coverage.run]
source = ["etl"]
omit = ["etl/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
